appId: no.bambubrowser.app
productName: Bambu Browser
copyright: Copyright (c) 2026 Øyvind Øyen
asar: true
directories:
  output: dist
files:
  - electron/**/*
  - package.json
  - '!**/node_modules/**'
extraResources:
  - from: server.js
    to: server.js
  - from: out
    to: out
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - arm64
  # Ad-hoc signature. Without one, Gatekeeper reports the downloaded app as damaged.
  identity: '-'
  # Library validation under hardened runtime rejects the pre-signed Electron framework when signing ad-hoc.
  hardenedRuntime: false
  # Do not enable App Sandbox; server.js must read ~/Library/Application Support/BambuStudio.
win:
  target:
    - target: nsis
      arch:
        - x64
